<!DOCTYPE html>
<html>
<head>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.20.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.20.0/mapbox-gl.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Style+Script&display=swap" rel="stylesheet">
    <style>

        .map-container {
                position: relative; /* CRITICAL: Pins children to this box */
                width: 100%;        /* Fills the width of its parent column */
                max-width: 900px;   /* Prevents it from getting too huge */
                height: 550px;      /* Set your desired height here */
                margin: 20px auto;  /* Centers the widget in your article */
                border-radius: 12px;
                overflow: hidden;   /* Keeps the map corners rounded */
                border: 1px solid #ddd;
        }
        

        #map-grandtour { position: absolute; top: 0; bottom: 0; width: 100%; }

        .mapboxgl-popup {
            z-index: 20;
        }

        .mapboxgl-marker {
            cursor: pointer;
            /* transition: transform 0.2s ease; */
            opacity: 0.8 !important;
        }

        /* The hover effect we trigger in JS */
        .marker-hover {
            transform: scale(1.3);
            filter: drop-shadow(0 0 5px rgba(0,0,0,0.3));
            opacity: 1 !important; /* Override default opacity on hover */
        }

        #grandtour-card-title {
            font-size: 1.5em;
            /* font-weight: bold; */
            margin-bottom: 5px;
            font-family: 'Style Script', cursive;
            text-align: center;
            letter-spacing: 0.02em;
             /* Add some spacing between the image and text */
            
        }

        #grandtour-card {
            position: relative;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 300px;
            background: white;
            z-index: 10;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 20px;
            transition: opacity 0.3s ease;
            opacity: 0.95;
            align-items: center;
        }

        #grandtour-card.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #grandtour-card-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            
        }

        .grandtour-image-container {
            justify-content: center;
            position: relative;
            width: 200px;
            aspect-ratio: 2 / 3;
            overflow: visible;
            border-radius: 8px; /* Optional: add rounded corners to the image container */
        }

        .grandtour-photo,
        .grandtour-frame {
            position: absolute;
            bottom: 0;
            width: 100%;
            object-fit: cover;
        }

        .grandtour-photo{
            z-index: 21;
            opacity: 1;
        }

        .grandtour-frame {
            pointer-events: none;
            z-index: 22; /* Optional: add rounded corners to the photo */
        }



        .inline-svg {
            height: 1em;
            width: auto;
            vertical-align: middle;
            /* Adjusting by a small percentage of the height 
            usually centers it perfectly with the cap-height */
            position: relative;
            top: -0.05em; 
            margin-left: 0.05em;
            margin-right: 0.05em;
        }


        

        .btn-reset {
            cursor: pointer;
            background: #495057;
            color: white;
            border: none;
            padding: 12px 12px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin: 3em 0 0 0;
        }

        .btn-reset:hover {
            background: #EA291C;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        .btn-reset:active {
            transform: translateY(0);
        }


        

        /* MOBILE RESPONSIVENESS */
        @media (max-width: 600px) {
            /* Adjust the info card to be a bottom sheet on mobile */
            /* align to center bottom*/

            .map-container {
                height: 550px; /* Smaller height for mobile screens */
            }

            #grandtour-card {
                max-width: 230px;
            }

            #grandtour-card-title {
                font-size: 1.4em;
            }
        }
    </style>

</head>
<body>

<style>
@keyframes popupFadeIn {
    from {
        opacity: 0;
    }
    to {
        opacity: 1;
    }
}

.mapboxgl-popup {
    z-index: 20;
    animation: popupFadeIn 0.2s ease-out;
}
</style>


<div class="map-container">
<div id="map-grandtour"></div>



<div id="grandtour-card" class="hidden">
    
  <div id="grandtour-card-content">
    
    <h2 id="grandtour-card-title"></h2>
    <div id="grandtour-image-container" class="grandtour-image-container"></div>
    <button class="btn-reset" onclick="resetMap();" id="grandtour-card-close">Close</button>
  </div>

  
</div>

</div>
<script src="grandtour.js"></script>
</body>
</html>
