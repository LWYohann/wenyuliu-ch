<!DOCTYPE html>
<html>

<head>

  <meta charset="utf-8" />
  <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>MapLibre GL JS Tutorials: Display a map</title>
  <style>
    html,
    body,
    #map {
      padding: 0;
      margin: 0;
      /* height: 100%;
      width: 100%; */
      height: 300px;
      width: 500px;
      font-family: Arial, Helvetica, sans-serif;
      /* font-size: 14px; */
      color: #323232;
    }
  </style>

  <script src=https://unpkg.com/maplibre-gl@5.2.0/dist/maplibre-gl.js></script>
  <link href=https://unpkg.com/maplibre-gl@5.2.0/dist/maplibre-gl.css rel="stylesheet" />

</head>


<body>
  <div id="map"></div>

  <script>

    const map = new maplibregl.Map({
      container: "map", // the id of the div element
      style: `https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json`,
      zoom: 1, // starting zoom
      center: [70, 40] // starting location [longitude, latitude]
    });

    map.on('load', () => {
        map.addSource('airports', {
            type: 'geojson',
            data: './my_airports_gdf.geojson'
        });

        map.addLayer({
            id: 'airports',
            type: 'circle',
            source: 'airports',
            paint: {
                'circle-radius': ["+",["get", "No. visit"], 3],
                'circle-color': 'orange',
                'circle-opacity': 0.6,
                'circle-stroke-color': 'black',
                'circle-stroke-width': 1
            }
        });

        map.on('click', 'airports', (e) => {
            const coordinates = e.features[0].geometry.coordinates.slice();
            const { Name, 'No. visit': noVisit } = e.features[0].properties;
            
            new maplibregl.Popup()
                .setLngLat(coordinates)
                .setHTML(`<strong>${Name}</strong><br>No. visit: ${noVisit}`)
                .addTo(map);
        });

        map.on("mouseenter", "airports", () => {
            map.getCanvas().style.cursor = "pointer";
        });
        map.on("mouseleave", "airports", () => {
            map.getCanvas().style.cursor = "";
        });

        map.addSource('flights', {
            type: 'geojson',
            data: './my_flights_gdf.geojson'
        });

        map.addLayer({
            id: 'flights',
            type: 'line',
            source: 'flights',
            layout: {
                'line-join': 'round',
                'line-cap': 'round'
            },
            paint: {
                'line-color': 'black',
                'line-width': ["*", ["get", "No. flight"], 1.5]
            }
        });

        map.on('click', 'flights', (e) => {
            const coordinates = e.features[0].geometry.coordinates[0];
            const { Route, 'No. flight': noFlight } = e.features[0].properties;

            new maplibregl.Popup()
                .setLngLat(coordinates)
                .setHTML(`<strong>${Route}</strong><br>No. flight: ${noFlight}`)
                .addTo(map);
        });
        map.on("mouseenter", "flights", () => {
            map.getCanvas().style.cursor = "pointer";
        });
        map.on("mouseleave", "flights", () => {
            map.getCanvas().style.cursor = "";
        });
    });



    // Add Esri attribution
    // Learn more in https://esriurl.com/attribution
    // map._controls[0].options.customAttribution += " | Powered by Esri "
    // map._controls[0]._updateAttributions()

  </script>

</body>


</html>
